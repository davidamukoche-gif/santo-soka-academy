services:
  postgres:
    image: postgres:16-alpine
    container_name: papertrail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: papertrail
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: papertrail_dev_password
    ports:
      - "5432:5432"
    volumes:
      - papertrail_pgdata:/var/lib/postgresql/data

volumes:
  papertrail_pgdata:
