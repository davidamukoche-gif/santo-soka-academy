services:
  - type: web
    name: papertrail-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm run db:migrate && pnpm run api:start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: papertrail-postgres
          property: connectionString
      - key: API_PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://davidamukoche-gif.github.io

# The Postgres instance was created separately in the Render workspace.
# The Blueprint references it by name so its credentials never enter Git.
